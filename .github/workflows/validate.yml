name: Validate plugin
# This repository is generated from github.com/pgrundev/pgx (plugins/pgx +
# LICENSE + plugins/standalone, assembled by plugins/sync.sh --standalone and
# published by that repository's publish-plugin workflow). This workflow
# proves the published tree is a valid, installable Claude Code plugin and
# that it has not drifted from the canonical plugin. It never pushes anything.
on:
  push:
    branches: [main]
  pull_request:
  schedule: [{ cron: "17 6 * * *" }]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    name: Manifest, directory profile, hygiene, install cycle
    runs-on: ubuntu-24.04
    env:
      DISABLE_TELEMETRY: "1"
      DISABLE_AUTOUPDATER: "1"
      CLAUDE_CODE_DISABLE_NONESSENTIAL_TRAFFIC: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Install the Claude Code CLI (pinned; validate/install need no login)
        run: npm install -g @anthropic-ai/claude-code@2.1.311 && claude --version
      - name: claude plugin validate --strict
        run: claude plugin validate --strict .
      - name: Directory submission profile (fails on a finding the directory would block on)
        run: claude plugin validate --profile directory .
      - name: Package hygiene (what the directory and the plugin loader expect)
        run: |
          set -eu
          test -f .claude-plugin/plugin.json && test -f .claude-plugin/marketplace.json
          test -f skills/pgx/SKILL.md && test -f README.md && test -f LICENSE
          for d in hooks bin commands agents .mcp.json .lsp.json settings.json monitors workflows package.json .gitattributes .gitmodules; do
            [ ! -e "$d" ] || { echo "the plugin must not ship $d" >&2; exit 1; }
          done
          ! git ls-files -s | awk '$1 == 120000' | grep . || { echo "symlinks in the repository" >&2; exit 1; }
          ! git ls-files | grep -E '(^|/)(\.DS_Store|Thumbs\.db|desktop\.ini|__MACOSX)(/|$)' || { echo "system files in the repository" >&2; exit 1; }
          n=$(git ls-files | wc -l); [ "$n" -le 512 ] || { echo "$n files (directory limit 512)" >&2; exit 1; }
          big=$(git ls-files -z | xargs -0 -I{} find {} -type f -size +256k); [ -z "$big" ] || { echo "files over 256 KiB: $big" >&2; exit 1; }
          depth=$(git ls-files | awk -F/ '{ if (NF > m) m = NF } END { print m }'); [ "$depth" -le 6 ]
          kb=$(du -sk --exclude=.git . | cut -f1); echo "tree: $n files, $kb KB, max depth $depth"; [ "$kb" -lt 1024 ]
          test -x skills/pgx/scripts/check-pgx.sh && test -x skills/pgx/scripts/detect-project.sh
          grep -q 'CLAUDE_PLUGIN_ROOT}/skills/pgx/scripts/' skills/pgx/SKILL.md
          pv=$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          sv=$(grep -E '^  version: "' skills/pgx/SKILL.md | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          [ "$pv" = "$sv" ] || { echo "plugin.json version $pv != SKILL.md metadata.version $sv" >&2; exit 1; }
          python3 - <<'PY'
          import json
          p = json.load(open(".claude-plugin/plugin.json")); m = json.load(open(".claude-plugin/marketplace.json"))
          assert p["name"] == "pgx" and p["displayName"] and p["license"] == "AGPL-3.0" and p["author"]["name"], p
          e = [x for x in m["plugins"] if x["name"] == "pgx"]
          assert m["name"] == "pgx-plugin" and len(e) == 1 and e[0]["source"] == "./" and "version" not in e[0], m
          PY
          ! grep -rnE 'postgres(ql)?://[^*$"<` ]+:[^*$"<` ]+@' --exclude-dir=.git . | grep -v '\.\.\.' | grep -v '…' | grep -v ':\*\*\*@' || { echo "credentialed URL" >&2; exit 1; }
          ! grep -rnE '(sk-ant-|ghp_[A-Za-z0-9]{20}|AKIA[0-9A-Z]{16}|npm_[A-Za-z0-9]{30}|-----BEGIN [A-Z ]*PRIVATE KEY)' --exclude-dir=.git . || { echo "secret-like token" >&2; exit 1; }
      - name: Helper scripts execute
        run: |
          bash skills/pgx/scripts/detect-project.sh . | python3 -c 'import json,sys; json.load(sys.stdin)'
          # exits 3 (pgx missing) on this runner; the output must still be one JSON line
          bash skills/pgx/scripts/check-pgx.sh | python3 -c 'import json,sys; json.load(sys.stdin)' || true
      - name: Install cycle from this checkout as a marketplace, in an isolated configuration
        run: |
          set -eu
          export CLAUDE_CONFIG_DIR="$RUNNER_TEMP/cfg"; mkdir -p "$CLAUDE_CONFIG_DIR"
          claude plugin marketplace add "$PWD" --json | tail -1 | grep -q '"outcome":"ok"'
          claude plugin install pgx@pgx-plugin --json | tail -1 | grep -q '"outcome":"ok"'
          claude plugin list --json | python3 -c 'import json,sys; l=json.load(sys.stdin); e=[p for p in l if p["id"]=="pgx@pgx-plugin"]; assert len(e)==1 and e[0]["enabled"], l; print("installed", e[0]["version"])'
          claude plugin details pgx | tee "$RUNNER_TEMP/details.txt"
          grep -qE 'Skills \(1\) +pgx' "$RUNNER_TEMP/details.txt"
          grep -q 'Hooks (0)' "$RUNNER_TEMP/details.txt" && grep -q 'MCP servers (0)' "$RUNNER_TEMP/details.txt"
          claude plugin uninstall pgx@pgx-plugin --json | tail -1 | grep -q '"outcome":"ok"'
          claude plugin marketplace remove pgx-plugin --json | tail -1 | grep -q '"outcome":"ok"'
      - name: Secret scan (gitleaks)
        run: |
          curl -fsSL https://github.com/gitleaks/gitleaks/releases/download/v8.21.2/gitleaks_8.21.2_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks dir . --no-banner --redact
  drift:
    name: No drift from the canonical plugin in pgrundev/pgx
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: { path: standalone }
      - uses: actions/checkout@v4
        with:
          repository: pgrundev/pgx
          ref: main
          path: canonical
          sparse-checkout: |
            plugins
            skills/pgx
      - name: Compare with plugins/sync.sh --standalone
        run: canonical/plugins/sync.sh --check-standalone "$PWD/standalone"
